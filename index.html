<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="행보드"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><title>행보드 타이머</title>
<style>
:root{--bg:#09090b;--card:#141416;--card2:#1c1c20;--line:rgba(255,255,255,.08);--tx:#f4f4f5;--mut:#9a9aa2;--ac:#ff7a33;--pc:#ff7a33;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
main{padding:calc(20px + var(--st)) 18px calc(96px + var(--sb));max-width:560px;margin:auto}
section{display:none;animation:fd .3s ease}section.on{display:block}@keyframes fd{from{opacity:0}}
h1{font-size:30px;font-weight:700;margin:6px 4px 18px;letter-spacing:-.02em}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(14,14,16,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--sb));z-index:10}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:12px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s}
nav button i{width:22px;height:22px;border-radius:7px;border:2px solid currentColor;display:block}nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.big3{display:flex;flex-direction:column;gap:18px}
.stp{display:flex;align-items:center;gap:10px}.stp label{flex:1;white-space:nowrap;font-size:15px;font-weight:600;color:var(--mut)}
.stp button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:26px;font-weight:300;line-height:1;transition:transform .1s,background .2s;touch-action:none;user-select:none}
.stp button:active{transform:scale(.92);background:#2a2a2e}
.stp span{min-width:92px;text-align:center;font-size:48px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.chips{display:flex;gap:6px;margin-top:-6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:1;min-width:0;padding:8px 0;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--mut);font-size:13px;font-weight:500;transition:all .2s}
.chips button.on{background:var(--ac);color:#000;border-color:var(--ac)}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:4px;gap:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px;border-radius:999px;font-size:14px;font-weight:600;transition:all .25s}.seg button.on{background:#fff;color:#000}
.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row label{flex:1;color:var(--tx);font-size:15px}
.row.btns{border:0;gap:8px}
input,select,textarea{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}input[type=number]{width:84px;text-align:right;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}textarea{width:100%;resize:vertical;margin-top:8px}select{max-width:62%}
.btn{padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card2);color:var(--tx);font:inherit;font-size:14px;font-weight:600;transition:transform .1s}.btn:active{transform:scale(.96)}
.sm{padding:8px 14px;font-size:13px}
.go{background:var(--ac);color:#000;border:0;font-size:18px;font-weight:700;width:100%;padding:18px;margin-top:4px;box-shadow:0 8px 30px rgba(255,106,26,.25)}
.board{position:relative;width:100%;margin-top:12px}.board img,.board svg{width:100%;display:block;border-radius:14px}
.hold{position:absolute;width:7%;height:15%;transform:translate(-50%,-50%);border:1.5px solid rgba(255,255,255,0);border-radius:40%;cursor:pointer;transition:all .2s}
.hold:hover{border-color:rgba(255,255,255,.6)}.hold.sel{border:2px solid var(--ac);background:rgba(255,106,26,.35);box-shadow:0 0 0 4px rgba(255,106,26,.2)}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none}#toast.on{opacity:1}
.mut{color:var(--mut);font-size:13px}#holdtxt{margin-top:10px}
#run{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;z-index:20;text-align:center;overflow-y:auto;padding:calc(16px + var(--st)) 22px calc(12px + var(--sb));gap:0;background:#09090b}
#run.prep{--pc:#e6b15a}#run.hang{--pc:#ff5a3c}#run.rest{--pc:#3dbe7a}#run.setrest{--pc:#79b7ff}#run.done{--pc:#8e8e93}
#ph{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--pc);max-width:100%;line-height:1.3;margin:0}
.ring{position:relative;width:min(62vw,34dvh,250px);aspect-ratio:1;margin:8px 0 4px;flex:0 0 auto}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}.ring .bg{stroke:rgba(255,255,255,.08)}.ring .fg{stroke:var(--pc);stroke-linecap:round}
#dg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(26vw,108px);font-weight:250;font-variant-numeric:tabular-nums;letter-spacing:-.05em}
#grip{font-size:18px;font-weight:650;padding:0 8px;border:0;background:transparent;max-width:100%;line-height:1.35}
#info{font-size:15px;color:var(--mut);margin:6px 0 0;font-variant-numeric:tabular-nums}
#next{font-size:16px;font-weight:650;margin:2px 0 0;padding:0 12px;color:var(--tx)}
#tot{font-size:13px;color:#6f6f76;margin:2px 0 0}
#holdside[hidden],#bd[hidden],#bdback[hidden],#bdclose[hidden],#singlehint[hidden],#editcap[hidden]{display:none !important}
#hb #bd{width:150px;margin:0 auto;cursor:pointer}
#hb #bd.open{position:fixed;z-index:26;left:12px;right:12px;top:12%;width:auto;max-width:560px;margin:0 auto;cursor:default}
#hb #bd .hold{pointer-events:none}
#hb #bd.open .hold{pointer-events:auto}
#bdback{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.72)}
#bdclose{position:fixed;z-index:27;top:12px;right:12px;min-width:44px;min-height:44px}
#hb #bd img,#rb img{border-radius:12px}
#rb{width:min(88%,300px);margin:6px auto 0}
#run .ctl{display:flex;flex-direction:column;gap:6px;margin-top:8px;width:min(100%,420px);padding-top:0}
#run .ctl button{min-width:44px;min-height:48px;height:48px;padding:0 12px;border:0;border-radius:14px;background:transparent;color:#c7c7cd;font:inherit;font-size:15px;font-weight:650}
#run .ctl #rp{background:var(--ac);color:#1a0d05;width:100%;height:56px;min-height:56px;font-size:18px}
#run .subctl{display:flex;gap:8px;width:100%}
#run .subctl button{flex:1}
.tm{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;transition:all .3s}
.tm .t{font-size:38px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.tm .btn{width:44px;height:44px;padding:0;border-radius:50%}
.tm.fin{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 30px rgba(255,106,26,.3);animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.6}}
#sw{font-size:72px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.04em;padding:24px 0}
ol,ul{padding:0;margin:0;list-style:none}li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}li:last-child{border:0}
.ok{color:#32d74b}.no{color:var(--mut)}

#hb h1{font-size:22px;font-weight:680;letter-spacing:-.04em;margin:0;line-height:1.1}
#hb .topbar{display:flex;align-items:center;justify-content:space-between;margin:0}
.eyebrow{display:none}
#hb section.pane{display:block}
.pane{margin:0 0 4px}
.pane h2{display:none}
#hb .seg{display:flex;background:transparent;padding:0;gap:6px;margin:0 0 4px;flex-wrap:wrap}
#hb .seg button{flex:1 1 72px;min-height:44px;border-radius:14px;background:#17171a;color:#dddde2;border:1px solid transparent;font-size:15px;font-weight:650;padding:6px 4px}
#hb #eqseg{gap:14px;margin:0 0 2px}
#hb #eqseg button{flex:0 1 auto;min-height:36px;padding:4px 0;background:transparent;border:0;border-radius:0;border-bottom:2px solid transparent;color:#8e8e96;font-size:15px}
#hb #eqseg button.on{background:transparent;color:#fff;border-bottom-color:var(--ac)}
#handseg button.on{background:var(--ac);color:#1a0d05}
.pickline{display:flex;flex-direction:column;gap:2px;margin:0 0 4px;color:var(--mut);font-size:12px;font-weight:700}
#hb .pickline select{max-width:none;width:100%;height:44px;font-size:16px;border-radius:14px;padding:0 14px}
.hint{margin:4px 2px 0;color:#8d8d95;font-size:13px;line-height:1.35}
#handhint,#singlehint{display:none}
.holdline{margin:0 2px;font-size:13px;font-weight:650;text-align:center}
#hb .metric{display:flex;align-items:center;gap:6px;margin-top:2px}
#hb .metric .ml{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:flex-start;gap:8px;text-align:left}
#hb .metric .ml span{display:inline;min-width:0;text-align:left;color:var(--tx);font-size:15px;font-weight:650}
#hb .metric .ml p{margin:0;display:flex;align-items:baseline;gap:2px}
#hb .metric .ml b{font-size:22px;font-weight:560;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.pair{display:flex;gap:8px;margin-top:2px}
.pair .metric{flex:1;margin-top:0;min-width:0}
#hb .metric .ml i{font-style:normal;color:var(--mut);font-size:14px}
#hb .stp button{width:44px;height:44px;border-radius:14px;font-size:22px;background:#1c1c20;border:1px solid var(--line)}
#hb .chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 0}
#hb .chips button{flex:1 1 44px;min-width:44px;min-height:44px;border-radius:12px;font-size:15px;background:transparent;color:#bdbdc4}
#hb .chips button.on{background:var(--ac);color:#1a0d05;border-color:var(--ac)}
#addstep{width:100%;min-height:44px;margin-top:2px;border-radius:14px;border:1px dashed rgba(255,122,51,.7);background:transparent;color:#ffc2a2;font-size:16px;font-weight:750}
#seqbox{margin-top:8px}
.seq .it{display:flex;align-items:center;gap:6px;background:#17171a;border-radius:16px;padding:4px 4px 4px 14px;margin-bottom:8px}
.seq .it.on{outline:1px solid var(--ac)}
.seq .pick{flex:1;min-height:52px;text-align:left;border:0;background:transparent;color:var(--tx);font:inherit;padding:6px 0}
.seq .pick b{display:block;font-size:15px}
.seq .sub{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.seq .mv{display:flex;gap:4px}
.seq .mv button{min-width:44px;min-height:44px;border:0;border-radius:12px;background:#222226;color:var(--tx);font-size:16px}
details.more{background:transparent;border:0;padding:0;margin:0 0 8px}
details.more summary{min-height:48px;padding:12px 2px;color:#bdbdc4;font-weight:650;display:block;cursor:pointer}
details.more summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
details.more summary::before{content:"";display:none}
details.more .inn{padding:0 0 8px}
main{padding:calc(8px + var(--st)) 20px calc(150px + var(--sb));max-width:480px}
#start{position:fixed;z-index:12;left:50%;bottom:calc(62px + var(--sb));transform:translateX(-50%);width:min(440px,calc(100% - 32px));min-height:48px;margin:0;padding:0 16px;border-radius:18px;box-shadow:none;font-size:17px}
#start:active{transform:translateX(-50%) scale(.98)}
.hold{z-index:1}
.hold .bdg{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--ac);color:#1a0d05;font-size:10px;font-weight:800;line-height:14px;padding:0 4px;border-radius:999px;pointer-events:none}

</style></head><body>
<nav><button data-t="hb" class="on"><i></i>트레이닝</button><button data-t="tm"><i style="border-radius:50%"></i>타이머</button><button data-t="swp"><i style="border-radius:50%;border-style:dashed"></i>스톱워치</button><button data-t="log"><i style="border-radius:4px"></i>기록</button></nav>
<main>
<section id="hb" class="on">
<header class="topbar"><div><p class="eyebrow">오늘 훈련</p><h1>행보드</h1></div><button class="btn sm" id="ashare" type="button">공유</button></header>
<section class="pane">
  <h2>무엇을 잡을까</h2>
  <div class="seg" id="eqseg" role="group" aria-label="장비"><button type="button" data-b="bm1000">BM 1000</button><button type="button" data-b="bm2000">BM 2000</button><button type="button" data-b="bar">철봉</button></div>
  <label class="pickline">그립<select id="f_grip"></select></label>
  <div class="seg hands" id="handseg" role="group" aria-label="손"><button type="button" data-h="both">양손</button><button type="button" data-h="left">왼손</button><button type="button" data-h="right">오른손</button><button type="button" data-h="alt">좌우교대</button></div>
  <p class="hint" id="handhint"></p>
  <p class="holdline" id="holdtxt">홀드를 탭해서 선택</p>
  <div class="chips" id="holdside"><button type="button" data-side="L">왼쪽 홀드</button><button type="button" data-side="R">오른쪽 홀드</button></div>
  <div class="board" id="bd" role="button" tabindex="0" aria-label="보드, 탭하면 크게 봅니다"></div>
<div id="bdback" hidden></div><button type="button" class="btn sm" id="bdclose" hidden>닫기</button>
</section>
<section class="pane">
  <h2>얼마나 할까</h2>
  <div class="metric stp"><div class="ml"><span>수행 시간</span><p><b id="v_hang"></b><i>초</i></p></div><button type="button" data-k="hang" data-d="-1" aria-label="수행 시간 줄이기">−</button><button type="button" data-k="hang" data-d="1" aria-label="수행 시간 늘리기">+</button></div>
  <div class="chips" id="chips-hang" data-k="hang"></div>
  <div class="metric stp"><div class="ml"><span>렙 사이 휴식</span><p><b id="v_repRest"></b><i>초</i></p></div><button type="button" data-k="repRest" data-d="-1" aria-label="휴식 줄이기">−</button><button type="button" data-k="repRest" data-d="1" aria-label="휴식 늘리기">+</button></div>
  <div class="chips" id="chips-rep" data-k="repRest"></div>
  <div class="pair">
    <div class="metric stp"><div class="ml"><span>렙</span><p><b id="v_reps"></b></p></div><button type="button" data-k="reps" data-d="-1" aria-label="렙 줄이기">−</button><button type="button" data-k="reps" data-d="1" aria-label="렙 늘리기">+</button></div>
    <div class="metric stp"><div class="ml"><span>세트</span><p><b id="v_sets"></b></p></div><button type="button" data-k="sets" data-d="-1" aria-label="세트 수 줄이기">−</button><button type="button" data-k="sets" data-d="1" aria-label="세트 수 늘리기">+</button></div>
  </div>
  <p class="hint" id="editcap" hidden></p>
  <div id="seqbox" hidden><div class="seq" id="seqlist"></div></div>
  <button class="btn" id="addstep" type="button">+ 수행 추가</button>
  <p class="hint" id="singlehint">세트 수는 이 순서를 반복하는 횟수입니다. 수행 추가는 다른 행을 순서에 넣습니다.</p>
</section>
<details class="pane more" id="more"><summary id="moresum">더보기 · 세트 사이 휴식</summary><div class="inn">
  <div class="row"><label>프리셋</label><select id="psel"></select></div>
  <div class="row btns"><button class="btn sm" id="psave" type="button">저장</button><button class="btn sm" id="pnew" type="button">새로 저장</button><button class="btn sm" id="pdel" type="button">삭제</button><button class="btn sm" id="pshare" type="button">프리셋 공유</button></div>
  <div class="row" id="namerow"><label>수행 이름</label><input id="f_stepname" maxlength="40"></div>
  <div id="gapbox">
    <div class="stp metric"><div class="ml"><span>다음 수행까지</span><p><b id="v_gap"></b><i>초</i></p></div><button type="button" data-k="gap" data-d="-1" aria-label="사이 휴식 줄이기">−</button><button type="button" data-k="gap" data-d="1" aria-label="사이 휴식 늘리기">+</button></div>
    <div class="chips" id="chips-gap" data-k="gap"></div>
    <p class="hint">이 수행과 다음 수행 사이의 휴식입니다.</p>
  </div>
  <p class="hint" id="gaphintlast" hidden>마지막 수행 다음은 세트 사이 휴식입니다.</p>
  <div class="stp metric"><div class="ml"><span>세트 사이 휴식</span><p><b id="v_rest"></b><i>초</i></p></div><button type="button" data-k="rest" data-d="-5" aria-label="세트 휴식 줄이기">−</button><button type="button" data-k="rest" data-d="5" aria-label="세트 휴식 늘리기">+</button></div>
  <div class="chips" id="chips-set" data-k="rest"></div>
  <div class="row"><label>준비 (초)</label><input type="number" id="f_prep" min="0"></div>
  <div class="row"><label>반복 (렙)</label><input type="number" id="f_reps" min="1"></div>
  <div class="row"><label>렙 사이 휴식 (초)</label><input type="number" id="f_repRest" min="0"></div>
  <div class="row"><label>추가 무게 (kg)</label><input type="number" id="f_kg" step="0.5"></div>
  <div class="row" id="exrow"><label>운동</label><select id="f_ex"></select></div>
  <div class="row" style="display:none"><label>장비</label><select id="f_board"><option value="bm1000">Beastmaker 1000</option><option value="bm2000">Beastmaker 2000</option><option value="bar">철봉 (Pull-up bar)</option></select></div>
  <textarea id="f_notes" rows="2" placeholder="메모"></textarea>
</div></details>
<button class="btn go" id="start" type="button">시작</button>
</section>
<section id="tm"><h1>타이머</h1><div class="card"><div class="row"><input id="tn" placeholder="이름" style="flex:1"><input type="number" id="tmm" value="3" min="0">분<input type="number" id="tss" value="0" min="0">초<button class="btn" id="tadd">추가</button></div></div><div id="tl"></div></section>
<section id="swp"><h1>스톱워치</h1><div class="card"><div id="sw">00:00.0</div><div class="row" style="justify-content:center"><button class="btn" id="sws">시작</button><button class="btn" id="swl">랩</button><button class="btn" id="swr">리셋</button></div><ol id="laps"></ol></div></section>
<section id="log"><h1>기록</h1><div class="card"><div class="row btns"><span style="flex:1" class="mut">최근 운동</span><button class="btn sm" id="lclr">전체 삭제</button></div><ul id="ll"></ul></div></section>
</main>
<div id="toast"></div><div id="run"><div id="ph"></div><div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="46"/><circle class="fg" id="rg" cx="50" cy="50" r="46" stroke-dasharray="289.03" stroke-dashoffset="0"/></svg><div id="dg"></div></div><div id="grip"></div><div id="info"></div><div id="next"></div><div id="tot"></div>
<div class="board" id="rb"></div>
<div class="ctl"><button id="rp" type="button">일시정지</button><div class="subctl"><button id="rs" type="button">건너뛰기</button><button id="rr" type="button">다시</button><button id="rx" type="button">종료</button></div><div class="subctl minor"><button id="rm5" type="button">−5초</button><button id="ra5" type="button">+5초</button><button id="rboard" type="button" aria-expanded="true">보드 닫기</button></div></div>

let AC;function beep(f=880,d=.15){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.4,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const vib=p=>navigator.vibrate&&navigator.vibrate(p);let WL;async function wake(on){try{if(on&&navigator.wakeLock)WL=await navigator.wakeLock.request("screen");else if(WL){WL.release();WL=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&R&&!R.done)wake(true)});
let R=null;
$("start").onclick=()=>{beep(600,.05);const preset=deep(S);R=HangLogic.createRun(preset,performance.now(),OPTS());R.lastBeep=null;$("run").style.display="flex";wake(true);enter();tick()};
function enter(){if(!R||R.done)return;const st=R.q[R.i];R.lastBeep=null;$("run").className=st.t;if(st.t==="hang"){beep(1320,.4);vib(300)}else{beep(660,.3);vib([100,80,100])}drawBoard($("rb"),st.board||R.s.board,HangLogic.holdsForPhase(st),false);paint()}
function paint(){const st=R.q[R.i];$("ph").textContent=HangLogic.phaseLabel(st);$("dg").textContent=fmt(R.left);$("rg").style.strokeDashoffset=289.03*(1-Math.max(0,R.left)/(st.d||1));
const g=GN(st.grip||R.s.grip)+(st.kg?` · +${st.kg}kg`:"");$("grip").textContent=g+" · "+((st.board||R.s.board)==="bar"?EN(st.ex):holdText(st));
let info=`세트 ${st.set}/${R.s.sets} · 렙 ${st.rep}/${st.reps||R.s.reps}`;if(st.sequence&&st.t!=="setrest"&&st.t!=="prep")info+=` · 수행 ${st.step+1}/${R.s.steps.length}`;$("info").textContent=info;$("next").textContent=HangLogic.nextLabel(R.q,R.i);
let rem=Math.max(0,R.left);for(let j=R.i+1;j<R.q.length;j++)rem+=R.q[j].d;$("tot").textContent="남은 시간 "+fmt(rem)}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):String(s)};
function tick(){if(!R||R.done)return;if(!R.paused){const before=R.i;HangLogic.tickRun(R,performance.now());if(R.done){finish(true);return}if(R.i!==before)enter();else{const c=Math.ceil(R.left);if(c<=3&&c>=1&&R.lastBeep!==c){R.lastBeep=c;beep(880,.12);vib(60)}paint()}}requestAnimationFrame(tick)}
function finish(ok){if(!R||R.finished)return;R.finished=true;R.done=true;$("run").className="done";$("ph").textContent=ok?"완료":"중단됨";$("dg").textContent="✓";$("rg").style.strokeDashoffset=0;$("next").textContent="";beep(1000,.6);vib([200,100,200]);wake(false);
const log=LS("hb_log",[]);const tot=R.q.filter(x=>x.t==="hang").length;const seq=HangLogic.isSequence(R.s);
const hold=seq?`수행 ${R.s.steps.length}종`:(R.s.board==="bar"?"철봉 · "+EN(R.s.ex):(HOLDS[R.s.board]?.[R.s.hold]?.[0]||""));
log.unshift({date:new Date().toISOString(),preset:R.s.name,grip:R.s.grip,kg:R.s.kg,hold,board:R.s.board,hand:R.s.hand,steps:seq?R.s.steps.length:1,done:R.hangs,total:tot,completed:ok&&R.hangs>=tot});SV("hb_log",log.slice(0,500));$("rp").style.display="none";$("rs").style.display="none";$("rx").textContent="닫기"}
$("rp").onclick=()=>{if(!R||R.done)return;if(R.paused){HangLogic.resumeRun(R,performance.now());$("rp").textContent="일시정지"}else{HangLogic.pauseRun(R,performance.now());$("rp").textContent="재개"}paint()};
const adj=d=>{if(!R||R.done)return;HangLogic.adjustRun(R,d,performance.now());R.lastBeep=null;paint()};$("ra5").onclick=()=>adj(5);$("rm5").onclick=()=>adj(-5);
$("rs").onclick=()=>{if(!R||R.done)return;HangLogic.advanceRun(R,performance.now());if(R.done)finish(true);else enter()};
$("rr").onclick=()=>{if(!R)return;const preset=R.s,stopped=!!R.done;R=HangLogic.createRun(preset,performance.now(),OPTS());R.lastBeep=null;$("rp").style.display=$("rs").style.display="";$("rp").textContent="일시정지";$("rx").textContent="종료";$("run").style.display="flex";enter();if(stopped)tick()};
$("rboard").onclick=()=>{const open=$("rb").hasAttribute("hidden");if(open)$("rb").removeAttribute("hidden");else $("rb").setAttribute("hidden","");$("rboard").setAttribute("aria-expanded",open?"true":"false");$("rboard").textContent=open?"보드 닫기":"보드"};
